# SearXNG on Docker Desktop (local build). See deploy/docker/README.md
name: searxng

services:
  core:
    container_name: searxng-core
    image: searxng/searxng:local
    restart: unless-stopped
    ports:
      - "127.0.0.1:${SEARXNG_PORT:-8080}:8080"
    environment:
      SEARXNG_BASE_URL: ${SEARXNG_BASE_URL:-http://localhost:8080/}
      SEARXNG_VALKEY_URL: valkey://valkey:6379/0
    volumes:
      - ./core-config/:/etc/searxng/
      - core-data:/var/cache/searxng/
    depends_on:
      - valkey

  valkey:
    container_name: searxng-valkey
    image: docker.io/valkey/valkey:9-alpine
    command: valkey-server --save 300 1 --save 60 1000 --loglevel warning
    restart: unless-stopped
    volumes:
      - valkey-data:/data/

volumes:
  core-data:
  valkey-data:
